# Ruff configuration for the Zen backend.
# Enforces real errors and common bugs; style rules that the existing
# codebase does not follow are excluded so CI stays green while still
# catching genuine problems.

line-length = 120

[lint]
# E  = pycodestyle errors, W = warnings, F = pyflakes
# We keep the default rule set but ignore the categories that produce
# noise on the existing code without catching real bugs.
select = ["E", "W", "F"]
ignore = [
    "E501",   # line too long – existing code exceeds 88 widely
    "F401",   # unused imports – many are used at runtime via FastAPI DI
    "F541",   # f-string without placeholders
    "F841",   # unused variable
]
